name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install dependencies
      run: npm install --legacy-peer-deps

    - name: Build web application
      run: npx vite build
      env:
        NODE_ENV: production

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Add Android platform
      run: |
        if [ ! -d "android" ]; then
          npx cap add android
        fi

    - name: Apply App Icon to Android
      run: |
        if [ -d "android/app/src/main/res" ]; then
          for mipmap in android/app/src/main/res/mipmap-*; do
            if [ -d "$mipmap" ]; then
              cp public/icon.png "$mipmap/ic_launcher.png" || true
              cp public/icon.png "$mipmap/ic_launcher_round.png" || true
              cp public/icon.png "$mipmap/ic_launcher_foreground.png" || true
            fi
          done
        fi

    - name: Sync Capacitor
      run: npx cap sync

    - name: Build APK (Debug)
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug --no-daemon

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: fcarena-vs-debug-apk
        path: android/app/build/outputs/apk/debug/app-debug.apk
