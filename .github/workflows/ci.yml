name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install dependencies
      run: npm install --legacy-peer-deps

    - name: Build web application
      run: npx vite build
      env:
        NODE_ENV: production

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Add Android platform
      run: |
        if [ ! -d "android" ]; then
          npx cap add android
        fi
        
        # Create google-services.json directly in the CI runner
        cat << 'EOF' > android/app/google-services.json
{
  "project_info": {
    "project_number": "1056646427549",
    "project_id": "fc-tournament-816ea",
    "storage_bucket": "fc-tournament-816ea.firebasestorage.app"
  },
  "client": [
    {
      "client_info": {
        "mobilesdk_app_id": "1:1056646427549:android:f58b0934e8f668efec7574",
        "android_client_info": {
          "package_name": "com.sperkplay.fctournament"
        }
      },
      "oauth_client": [
        {
          "client_id": "1056646427549-alg436s1bgkjagkpelpmsqc2l2upgq31.apps.googleusercontent.com",
          "client_type": 3
        }
      ],
      "api_key": [
        {
          "current_key": "AIzaSyCB3rXNmkJXxP4GgjTw0Vt5_G2tcwouWK8"
        }
      ],
      "services": {
        "appinvite_service": {
          "other_platform_oauth_client": [
            {
              "client_id": "1056646427549-alg436s1bgkjagkpelpmsqc2l2upgq31.apps.googleusercontent.com",
              "client_type": 3
            }
          ]
        }
      }
    }
  ],
  "configuration_version": "1"
}
EOF

    - name: Apply App Icon to Android
      run: |
        if [ -d "android/app/src/main/res" ]; then
          rm -rf android/app/src/main/res/mipmap-anydpi-v26
          for mipmap in android/app/src/main/res/mipmap-*; do
            if [ -d "$mipmap" ]; then
              cp public/icon.png "$mipmap/ic_launcher.png"
              cp public/icon.png "$mipmap/ic_launcher_round.png"
              cp public/icon.png "$mipmap/ic_launcher_foreground.png"
            fi
          done
        fi

    - name: Sync Capacitor
      run: |
        npx cap sync
        # Inject Google Client ID into Android strings.xml for the native plugin
        if [ -d "android/app/src/main/res/values" ]; then
          # Ensure strings.xml exists and has the server_client_id
          STRINGS_FILE="android/app/src/main/res/values/strings.xml"
          if [ ! -f "$STRINGS_FILE" ]; then
            echo '<?xml version="1.0" encoding="utf-8"?><resources></resources>' > "$STRINGS_FILE"
          fi
          if ! grep -q "server_client_id" "$STRINGS_FILE"; then
            sed -i 's/<\/resources>/    <string name="server_client_id">1056646427549-alg436s1bgkjagkpelpmsqc2l2upgq31.apps.googleusercontent.com<\/string>\n<\/resources>/' "$STRINGS_FILE"
          fi
        fi

    - name: Build APK (Debug)
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug --no-daemon
        
        echo "--- DEBUG SIGNING REPORT (Find SHA1 here) ---"
        ./gradlew signingReport --no-daemon | grep -A 5 "Variant: debug" || echo "Could not generate signing report"
        echo "--------------------------------------------"

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: fcarena-vs-debug-apk
        path: android/app/build/outputs/apk/debug/app-debug.apk
