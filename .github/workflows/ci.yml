name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install dependencies
      run: npm install --legacy-peer-deps

    - name: Build web application
      run: npx vite build
      env:
        NODE_ENV: production

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Add Android platform
      run: |
        if [ ! -d "android" ]; then
          npx cap add android
        fi

    - name: Apply App Icon to Android
      run: |
        if [ -d "android/app/src/main/res" ]; then
          # Remove adaptive XML icons in anydpi-v26 that conflict with PNG icons
          rm -rf android/app/src/main/res/mipmap-anydpi-v26
          
          # Replace icons in all standard density mipmap folders
          for mipmap in android/app/src/main/res/mipmap-*; do
            if [ -d "$mipmap" ]; then
              cp public/icon.png "$mipmap/ic_launcher.png"
              cp public/icon.png "$mipmap/ic_launcher_round.png"
              cp public/icon.png "$mipmap/ic_launcher_foreground.png"
            fi
          done
        fi

    - name: Sync Capacitor
      run: |
        npx cap sync
        # Inject Google Client ID into Android strings.xml for the native plugin
        if [ -d "android/app/src/main/res/values" ]; then
          sed -i 's/<\/resources>/    <string name="server_client_id">1056646427549-alg436s1bgkjagkpelpmsqc2l2upgq31.apps.googleusercontent.com<\/string>\n<\/resources>/' android/app/src/main/res/values/strings.xml
        fi

    - name: Build APK (Debug)
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug --no-daemon
        
        echo "--- DEBUG SHA-1 FINGERPRINT ---"
        keytool -list -v -keystore app/debug.keystore -alias androiddebugkey -storepass android -keypass android | grep SHA1 || echo "Could not find SHA1"
        echo "-------------------------------"

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: fcarena-vs-debug-apk
        path: android/app/build/outputs/apk/debug/app-debug.apk
